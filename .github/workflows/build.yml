name: build

on:
  push:
    branches:
      - master
    tags:
      - '*'
    paths:
      - '.github/workflows/build.yml'
      - 'module/**'
      - 'webui/**'
      - 'tests/**'
      - 'update.json'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - 'module/**'
      - 'webui/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set variables
      run: |
        COMMIT_NUM=$(git rev-list --count HEAD)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        VERSION=$(jq -r .version update.json)
        VERSION_CODE=$(jq -r .versionCode update.json)
        ZIP_URL=$(jq -r .zipUrl update.json)
        MODULE_VERSION=$(sed -n 's/^version=//p' module/module.prop)
        MODULE_VERSION_CODE=$(sed -n 's/^versionCode=//p' module/module.prop)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          [ "$GITHUB_REF_NAME" = "$VERSION" ] || { echo "tag does not match update.json" >&2; exit 1; }
          [ "$MODULE_VERSION" = "$VERSION" ] || { echo "module.prop version does not match update.json" >&2; exit 1; }
          [ "$MODULE_VERSION_CODE" = "$VERSION_CODE" ] || { echo "module.prop versionCode does not match update.json" >&2; exit 1; }
          [ "${ZIP_URL##*/}" = "SAN_$VERSION.zip" ] || { echo "zipUrl does not match update.json version" >&2; exit 1; }
        fi
        ZIP_NAME=SAN_$VERSION-$COMMIT_NUM-$COMMIT_HASH
        RELEASE_ZIP_NAME=SAN_$VERSION
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME" >> $GITHUB_ENV

    - name: Check module scripts
      run: shellcheck -s sh -S error module/*.sh module/dummy_zip/customize.sh

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 'latest'

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: Install WebUI dependencies
      run: pnpm --dir webui install --frozen-lockfile

    - name: Test module and WebUI
      run: pnpm --dir webui test

    - name: Build WebUI
      run: |
        cd webui
        pnpm lint
        # Build from reviewed, Git-tracked snapshots; never silently fetch
        # newer metadata while producing an APK/module or signed release.
        node scripts/verify-databases.cjs
        pnpm build

    - name: Extract changelog for version
      if: github.ref_type == 'tag'
      run: |
        # Extract changelog for the specific version from CHANGELOG.md
        # VERSION already has the v prefix (update.json: "v2.1.0")
        CHANGELOG=$(awk -v version="${{ env.VERSION }}" '
        BEGIN { found=0; content="" }
        /^### v[0-9]+\.[0-9]+\.[0-9]+/ {
          if (found) exit
          if ($0 ~ "### " version) {
            found=1
            next
          }
        }
        found && /^### v[0-9]+\.[0-9]+\.[0-9]+/ { exit }
        found && !/^---$/ { 
          if (content == "") {
            content = $0
          } else {
            content = content "\n" $0
          }
        }
        END { print content }
        ' CHANGELOG.md)
        
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$CHANGELOG" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create dummy zip
      run: |
        # Create dummy zip
        cd module/dummy_zip
        cp -r ../META-INF .
        zip -r dummy.zip *
        mv dummy.zip ../
        
    - name: Build and validate installable module ZIP
      shell: bash
      run: |
        set -euo pipefail
        # Tags get a stable release filename; branches get a traceable CI filename.
        INSTALL_ZIP="${ZIP_NAME}.zip"
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          INSTALL_ZIP="${RELEASE_ZIP_NAME}.zip"
        fi
        echo "INSTALL_ZIP=$INSTALL_ZIP" >> "$GITHUB_ENV"
        test -s module/module.prop
        test -s module/dummy.zip
        test -s module/webroot/index.html
        test -s module/webroot/uad.json
        test -s module/webroot/adl.json
        (
          cd module
          chmod 755 ./*.sh META-INF/com/google/android/update-binary
          zip -qr "../$INSTALL_ZIP" * -x 'dummy_zip' 'dummy_zip/*'
        )
        python3 tests/verify_module_zip.py "$INSTALL_ZIP" --expected-version "$VERSION"

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.ZIP_NAME }}
        # GitHub's artifact ZIP wraps one installable module ZIP.
        # Download with `gh run download` to extract the inner installer.
        path: ${{ env.INSTALL_ZIP }}

    - name: Create release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        body: ${{ env.CHANGELOG }}
        draft: false
        files: ${{ env.INSTALL_ZIP }}
