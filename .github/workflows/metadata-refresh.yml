name: Refresh reviewed UAD-NG and App Manager ADL metadata
on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: san-metadata-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository != 'chisewaguri/systemapp_nuker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 'latest'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Install pinned build dependencies
        run: pnpm --dir webui install --frozen-lockfile
      - name: Produce fresh validated source snapshots
        working-directory: webui
        run: |
          node scripts/fetch-uad.cjs
          node scripts/fetch-adl.cjs
          node scripts/verify-databases.cjs
      - name: Stage review PR when snapshots change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- webui/public/adl.json webui/public/uad.json; then
            echo 'Reviewed metadata snapshots are already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '## Metadata changes (review required)' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- webui/public/adl.json webui/public/uad.json >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'san-metadata[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ADL_SHA="$(node -e "console.log(require('./webui/public/adl.json').sources.adl.revision)")"
          UAD_SHA="$(node -e "console.log(require('./webui/public/adl.json').sources.uad.revision)")"
          SNAP_ID="$(sha256sum webui/public/adl.json webui/public/uad.json | sha256sum | cut -c1-12)"
          BRANCH="metadata/refresh-${SNAP_ID}"
          gh auth setup-git
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout -b "$BRANCH"
            git add webui/public/adl.json webui/public/uad.json
            git commit -m "chore(metadata): reviewed candidate ${SNAP_ID}"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$URL" ]; then
            URL="$(gh pr create --base master --head "$BRANCH" \
              --title "Review UAD-NG / ADL metadata ${SNAP_ID}" \
              --body "Candidate UAD-NG ${UAD_SHA:0:12}, ADL ${ADL_SHA:0:12}. **Manual review required.** Inspect removals, rating downgrades, missing entries, warnings, dependencies, and ROM-specific critical packages before merging. The build uses only committed reviewed data.")"
          fi
          echo "Review PR: $URL" >> "$GITHUB_STEP_SUMMARY"
          # PRs and branch pushes made with GITHUB_TOKEN do not normally fire
          # a second push/PR workflow. Dispatch the candidate build explicitly.
          gh workflow run build.yml --ref "$BRANCH"
